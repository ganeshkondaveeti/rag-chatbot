name: Scheduled Data Ingestion

on:
  schedule:
    # Run at 00:00 UTC every day
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual triggering from the GitHub UI

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Ingestion API
        run: |
          echo "Triggering ingestion pipeline..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "${{ secrets.RAILWAY_BACKEND_URL }}/api/ingest/refresh" \
            -H "Authorization: Bearer ${{ secrets.INGEST_API_KEY }}")
            
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          
          echo "Response Code: $HTTP_STATUS"
          echo "Response Body: $BODY"
          
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Ingestion failed with status code $HTTP_STATUS"
            exit 1
          fi
          
          echo "Ingestion completed successfully."
